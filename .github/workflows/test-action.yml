name: Test Action

on:
  push:
    branches:
      - master
  pull_request_target:
    branches:
      - master

permissions:
  checks: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run action
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository (push)
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v7

      - name: Check out repository (pull_request_target)
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Fork PR code runs with a token restricted to `checks: write` and
          # `contents: read` (see permissions above) and without access to secrets.
          allow-unsafe-pr-checkout: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Build action
        run: yarn build

      - name: Run linters
        uses: ./
        with:
          continue_on_error: false
          eslint: true
          prettier: true
          prettier_extensions: "css,html,js,json,jsx,less,md,scss,ts,tsx,vue,yaml,yml"
          neutral_check_on_warning: true

  test-checked-out-branch:
    name: Run action (checked-out branch)
    # The action switches to the PR branch itself. Checking out the branch here (instead of the
    # detached SHA above) covers the case where the branch is already checked out, which used to
    # fail with "cannot force update the current branch". Fork branches do not exist on origin,
    # so this job only runs for pull requests from the same repository.
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Build action
        run: yarn build

      - name: Run linters
        uses: ./
        with:
          continue_on_error: false
          eslint: true
          prettier: true
          prettier_extensions: "css,html,js,json,jsx,less,md,scss,ts,tsx,vue,yaml,yml"
          neutral_check_on_warning: true
